name: cygwin

on:
  push:
    branches: ["cygwin"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: |
          Invoke-WebRequest https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz -OutFile libffi-3.4.6.tar.gz
          tar xf libffi-3.4.6.tar.gz
          cd libffi-3.4.6
          sh ./autogen.sh
          sh ./configure
          make -j4
          make check
